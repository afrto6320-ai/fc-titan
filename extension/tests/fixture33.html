<!doctype html><html><head><meta charset="utf-8"/><style>
body{background:#17232d;color:#eee;font:14px Arial}.left{position:fixed;left:0;top:0;bottom:0;width:95px;background:#0b151c;display:grid;align-content:start;gap:15px;padding-top:120px}.left button{padding:12px 2px;color:white;border:0;background:#20313b;cursor:pointer}main{padding:120px 25px 25px 180px}.ut-market-search-filters-view{padding:12px;border:1px solid #425d75;max-width:400px}.ut-market-search-filters-view button,.ut-market-search-filters-view input{padding:11px;margin:4px}.ut-market-search-filters-view [role=option]{padding:10px;display:flex;align-items:center;cursor:pointer;border:1px solid #567}.ut-market-search-filters-view [role=option] img{height:26px;margin-right:8px}
</style></head><body><nav class="left"><button id="home">Home</button><button id="evolutions">Evolutions</button><button id="transfers">Transfers</button></nav><main id="main"><h1>FAKE EA Home</h1></main>
<script>
window.chrome={runtime:{getURL:x=>'/'+x,sendMessage:async()=>({ok:true,result:{items:[{name:'Mohamed Salah',rating:91,position:'RW',rarity:'Gold',itemId:999102,playerId:12345,key:'fixture-salah',imageUrl:''}]}})},storage:{local:{get:async()=>({}),set:async()=>{}}}};
const main=document.getElementById('main');
document.getElementById('transfers').onclick=()=>{main.innerHTML='<h1>Transfers</h1><button id="marketEntry">Transfer Market</button>';document.getElementById('marketEntry').onclick=()=>{main.innerHTML='<h1>Transfer Market</h1><button id="marketSearchEntry">Search the Transfer Market</button>';document.getElementById('marketSearchEntry').onclick=()=>{main.innerHTML=`<div class="ut-market-search-filters-view"><h2>Transfer Market Search</h2><label>Player Name <input aria-label="Player Name" id="nativePlayer" placeholder="Player Name" /></label><label>Max Buy Now <input aria-label="Max Buy Now" id="nativeMax" /></label><button id="nativeClub">Club</button><button id="nativeNation">Nation</button><button id="nativeLeague">League</button><button id="nativePosition">Position</button><button id="nativeQuality">Quality</button><button class="btn-standard primary" id="eaSearch">Search</button><div id="pickerOptions"></div><div class="SearchResults" id="EAresults"></div></div>`;
 for(const kind of ['Club','Nation','League','Position','Quality'])document.getElementById('native'+kind).onclick=()=>{const pane=document.getElementById('pickerOptions');pane.innerHTML=['Liverpool','Manchester City','Arsenal'].map(x=>`<div role="option"><img src="https://www.ea.com/favicon.ico" alt=""/>${x}</div>`).join('');for(const opt of pane.querySelectorAll('[role=option]'))opt.onclick=()=>{document.getElementById('native'+kind).dataset.picked=opt.textContent;pane.innerHTML='';};};
 document.getElementById('eaSearch').onclick=()=>{window.__eaSearches=(window.__eaSearches||0)+1;const results=document.getElementById('EAresults');results.innerHTML='<div class="ut-no-results-view">No Results</div>';};
 const player=document.getElementById('nativePlayer');player.addEventListener('input',()=>{const pane=document.getElementById('pickerOptions');pane.innerHTML='<div role="option">Mohamed Salah</div>';pane.firstElementChild.onclick=()=>{pane.innerHTML='';player.dataset.selected='Mohamed Salah';};});
 };};};
</script>
</body></html>
